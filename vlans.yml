name: lab-vlans


topology:
  nodes:
  
    srlswitch:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:24.10.1
      type: ixr-d3
      startup-config: configs/srlswitch.cfg
      
            
    ciscoswitch:
      kind: cisco_iol
      image: docker.io/edwin71/cisco-iol:L2-17.15.01
      type: L2
      startup-config: configs/cfg-cisco.txt

   
   
    PC1:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest
      exec:
       - ip -6 route del default dev eth0
       - ip route del default dev eth0
       - ip addr add 192.168.0.10/24 dev eth1
       #- ip route add default via 192.168.0.1
      
    PC2:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
       - ip -6 route del default dev eth0
       - ip route del default dev eth0
       - ip addr add 192.168.0.11/24 dev eth1
       #- ip route add default via 192.168.1.1

    PC3:
      kind: linux
      image: docker.io/esanchezv/kaliipv6:latest
      exec:
       - ip -6 route del default dev eth0
       - ip route del default dev eth0
       - ip addr add 10.20.0.10/24 dev eth1
       #- ip route add default via 192.168.0.1
      
    PC4:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      exec:
       - ip -6 route del default dev eth0
       - ip route del default dev eth0
       - ip addr add 10.20.0.11/24 dev eth1
       #- ip route add default via 192.168.1.1   
                    
                    
  links:
       
    - endpoints: ["srlswitch:e1-1","ciscoswitch:Ethernet0/1"]
    - endpoints: ["srlswitch:e1-2","PC1:eth1"]
    - endpoints: ["ciscoswitch:Ethernet0/2","PC2:eth1"]
    - endpoints: ["srlswitch:e1-3","PC3:eth1"]
    - endpoints: ["ciscoswitch:Ethernet0/3","PC4:eth1"]
    
    
      

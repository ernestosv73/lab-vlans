set / interface ethernet-1/1 admin-state enable
set / interface ethernet-1/1 vlan-tagging true
set / interface ethernet-1/1 subinterface 10 admin-state enable
set / interface ethernet-1/1 subinterface 10 type bridged
set / interface ethernet-1/1 subinterface 10 vlan encap single-tagged vlan-id 10
set / interface ethernet-1/2 admin-state enable
set / interface ethernet-1/2 vlan-tagging true
set / interface ethernet-1/2 subinterface 10 admin-state enable
set / interface ethernet-1/2 subinterface 10 type bridged
set / interface ethernet-1/2 subinterface 10 vlan encap untagged
set / network-instance bridge-1 type mac-vrf admin-state enable
set / network-instance bridge-1 interface ethernet-1/1.10
set / network-instance bridge-1 interface ethernet-1/2.10
